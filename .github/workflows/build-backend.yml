name: Build & Push Backend

on:
  workflow_call:

  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read
  packages: write

env:
  BACKEND_SERVICE_NAME: ${{ vars.SERVICE_NAME }}-backend
  GITHUB_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ vars.SERVICE_NAME }}
  AWS_BACKEND_IMAGE_NAME: ${{ secrets.AWS_ML_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.SERVICE_NAME }}-backend:${{ github.sha }}

jobs:
  backend-ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: "pnpm"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug TypeScript and ESLint versions
        run: |
          pnpm ls typescript @typescript-eslint/parser @typescript-eslint/eslint-plugin eslint

      - name: Build shared workspace
        run: pnpm --filter @artify/shared build

      - name: Lint
        run: pnpm --filter backend lint

      - name: Type Check
        run: pnpm --filter backend type-check

      - name: Run Tests
        run: pnpm --filter backend test

  build:
    needs: backend-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build -t artify-backend -f Dockerfile.backend .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/artify-backend
          VERSION=${{ github.sha }}
          docker tag artify-backend $IMAGE_ID:latest
          docker tag artify-backend $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:$VERSION
