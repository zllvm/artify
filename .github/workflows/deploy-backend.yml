name: Deploy Backend

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

env:
  BACKEND_SERVICE_NAME: ${{ inputs.environment }}-${{ vars.SERVICE_NAME }}-backend
  TF_WORKING_DIR: ./infra/backend

jobs:
  deploy-aws:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check BACKEND_SERVICE_NAME
        run: |
          echo "Backend Service Name: ${{ env.BACKEND_SERVICE_NAME }}"

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_S3 }}" \
            -backend-config="key=${{ vars.SERVICE_NAME }}/${{ inputs.environment }}/backend-tfstate"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: "Terraform Plan"
        run: |
          terraform plan -input=false \
            -var="service_name=${{ env.BACKEND_SERVICE_NAME }}" \
            -var="env=${{ inputs.environment }}" \
            -out=tfplan_aws
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Save Terraform plan as text
        run: terraform show tfplan_aws > tfplan_aws.txt
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload Terraform Plan Text
        uses: actions/upload-artifact@v4
        with:
          name: tfplan_aws
          path: ${{ env.TF_WORKING_DIR }}/tfplan_aws.txt

      - name: "Terraform Apply"
        run: terraform apply -input=false -auto-approve tfplan_aws
        working-directory: ${{ env.TF_WORKING_DIR }}
