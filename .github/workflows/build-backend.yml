  build:
    # needs: backend-ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      version: ${{ env.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        run: |
          PKG_VERSION=$(node -p "require('./apps/backend/package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          DATE=$(date +'%y%m%d')
          VERSION=v${PKG_VERSION}-${DATE}-${SHORT_SHA}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Computed VERSION=${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build -t ${{ env.BACKEND_SERVICE_NAME }} -f Dockerfile.backend .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        run: |
          docker tag ${{ env.BACKEND_SERVICE_NAME }} ${{ env.AWS_IMAGE_NAME }}:latest
          docker tag ${{ env.BACKEND_SERVICE_NAME }} ${{ env.AWS_IMAGE_NAME }}:${{ env.VERSION }}
          docker push ${{ env.AWS_IMAGE_NAME }}:latest
          docker push ${{ env.AWS_IMAGE_NAME }}:${{ env.VERSION }}
          echo "image_uri=${{ env.AWS_IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ env.VERSION }}" >> $GITHUB_OUTPUT

