name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      app:
        description: "App to build (backend or frontend)"
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      AWS_OIDC_ROLE_ARN:
        required: true
    outputs:
      container_image:
        value: ${{ jobs.build.outputs.container_image }}
      version:
        value: ${{ jobs.build.outputs.version }}

env:
  APP_NAME: ${{ inputs.service_name }}-${{ inputs.app }}
  AWS_IMAGE_NAME: ${{ vars.AWS_ML_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ inputs.environment }}-${{ inputs.service_name }}-${{ inputs.app }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      container_image: ${{ steps.meta.outputs.container_image }}
      version: ${{ steps.compute.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: compute
        run: |
          PKG_VERSION=$(node -p "require('./apps/${{ inputs.app }}/package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          DATE=$(date +'%y%m%d')
          VERSION=v${PKG_VERSION}-${DATE}-${SHORT_SHA}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Computed VERSION=${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (frontend)
        if: inputs.app == 'frontend'
        env:
          SENTRY_AUTH_TOKEN: ${{ vars.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          echo "SENTRY_DSN=${SENTRY_DSN}" | cut -c1-10
          echo "SENTRY_DSN length=${#SENTRY_DSN}"

          docker build \
          --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
          --build-arg NEXT_PUBLIC_BACKEND_URL=${{ vars.BACKEND_URL }} \
          --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }} \
          --build-arg SENTRY_DSN=${SENTRY_DSN} \
          --build-arg NEXT_PUBLIC_SENTRY_DEBUG=true \
          -t ${{ env.APP_NAME }} -f ${{ inputs.dockerfile }} .

      - name: Build Docker image (backend)
        if: inputs.app == 'backend'
        run: |
          docker build -t ${{ env.APP_NAME }} -f ${{ inputs.dockerfile }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        id: meta
        run: |
          docker tag ${{ env.APP_NAME }} ${{ env.AWS_IMAGE_NAME }}:latest
          docker tag ${{ env.APP_NAME }} ${{ env.AWS_IMAGE_NAME }}:${{ env.VERSION }}
          docker push ${{ env.AWS_IMAGE_NAME }}:latest
          docker push ${{ env.AWS_IMAGE_NAME }}:${{ env.VERSION }}
          echo "container_image=${{ env.AWS_IMAGE_NAME }}:${{ env.VERSION }}" >> $GITHUB_OUTPUT
